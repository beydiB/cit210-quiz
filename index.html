<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CIT210 Practice</title>
<style>
:root{--bg:#f7f6f2;--card:#fff;--ink:#1c1c1a;--mute:#6b6a64;--line:#dedcd4;--ok:#1d7a46;--okbg:#e3f3e9;--bad:#b3261e;--badbg:#fbe7e5;--acc:#2b4c9b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151514;--card:#201f1d;--ink:#ecebe6;--mute:#9b9a93;--line:#353430;--ok:#6fd49a;--okbg:#17321f;--bad:#ff8a80;--badbg:#3a1b19;--acc:#8fa8ff}}
:root[data-theme="dark"]{--bg:#151514;--card:#201f1d;--ink:#ecebe6;--mute:#9b9a93;--line:#353430;--ok:#6fd49a;--okbg:#17321f;--bad:#ff8a80;--badbg:#3a1b19;--acc:#8fa8ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.45 -apple-system,Roboto,system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:22px;margin:4px 0 2px}.sub{color:var(--mute);font-size:15px;margin:0 0 18px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 14px;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.sel{outline:2px solid var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.meta{display:flex;justify-content:space-between;color:var(--mute);font-size:14px;margin-bottom:10px}
.q{font-size:20px;font-weight:600;margin:0 0 14px}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:14px}
.opt.ok{background:var(--okbg);border-color:var(--ok)}.opt.bad{background:var(--badbg);border-color:var(--bad)}
.ex{margin-top:12px;padding:12px;border-radius:10px;background:var(--bg);font-size:16px}
.why{margin-top:8px;color:var(--mute)}
.bar{height:6px;background:var(--line);border-radius:3px;margin:10px 0 16px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.big{font-size:40px;font-weight:700;margin:6px 0}
ol{padding-left:20px}li{margin:10px 0}.mute{color:var(--mute)}
</style></head><body><main id="app"></main>
<script>
const Q = [{"q": "A computer is best described as an electronic device that...", "options": ["receives data, processes the data, and produces the result as the outcome", "stores data permanently and never processes it", "runs without any instructions or programs", "only displays text typed by the user"], "answer": 0, "explain": "A computer can be described as an electronic device that can receive data, process the data, and produce the result as the outcome.", "unit": "M1U1"}, {"q": "In the computer data flow process, the data received by the computer is conventionally known as...", "options": ["output", "information", "input", "firmware"], "answer": 2, "explain": "Conventionally, the received data is known as the input, while the result of the processing is known as output or information.", "unit": "M1U1"}, {"q": "A computer is basically divided into which two major parts?", "options": ["Hardware and software", "Input and output", "Users and programmers", "Memory and storage"], "answer": 0, "explain": "Basically, a computer is divided into two major parts, namely, hardware and software.", "unit": "M1U1"}, {"q": "Computers process numerical data in the form of 0's and 1's, which is the basis of...", "options": ["assembly language", "machine language", "high-level language", "human-readable language"], "answer": 1, "explain": "This digital format is the basis of the machine language, which differs from human-readable languages.", "unit": "M1U1"}, {"q": "A full-fledged computer system comprises users, application software, systems software, operating system and...", "options": ["printers only", "the Internet", "networking protocols", "hardware"], "answer": 3, "explain": "Ideally, a full-fledged computer system comprises users, application software, systems software, operating system, and hardware.", "unit": "M1U1"}, {"q": "In the architecture of a computer system, the users' subsystem comprises...", "options": ["routers, switches and hubs", "RAM, ROM and cache memory", "monitors, printers and plotters", "expert users, programmers/developers and end-users"], "answer": 3, "explain": "The users' subsystem comprises expert users, programmers/developers, and end-users.", "unit": "M1U1"}, {"q": "Which subsystem is described as the bedrock of other subsystems and the main focus of the course?", "options": ["The users' subsystem", "The application software subsystem", "The operating system subsystem", "The hardware subsystem"], "answer": 3, "explain": "The main focus of this course is the hardware subsystem. It is the bedrock of other subsystems.", "unit": "M1U1"}, {"q": "Which type of computer is multi-user, non-portable and used by large organizations such as NASRDA and CBN?", "options": ["Personal computer", "Minicomputer", "Workstation", "Laptop"], "answer": 1, "explain": "Minicomputers are multi-users-based computers and are not portable; they belong to large organizations such as NASRDA, NIMC and CBN.", "unit": "M1U1"}, {"q": "A typical supercomputer can solve up to how many individual calculations per second?", "options": ["Ten thousand", "Ten million", "Ten trillion", "Ten billion"], "answer": 2, "explain": "A typical supercomputer can solve up to ten trillion individual calculations per second.", "unit": "M1U1"}, {"q": "Which generation of computers used vacuum tubes for logic circuitry?", "options": ["Second generation, 1957-1963", "Third generation, 1964-1971", "First generation, 1940-1956", "Fourth generation, 1972-1990"], "answer": 2, "explain": "The first generation, 1940-1956, showcased the use of vacuum tubes for logic circuitry.", "unit": "M1U1"}, {"q": "Which company was the first to design and develop microprocessors?", "options": ["IBM", "Intel", "Microsoft", "Apple"], "answer": 1, "explain": "Intel was the first company to design and develop microprocessors.", "unit": "M1U1"}, {"q": "The IBM System z9 shown in the course text is an example of a...", "options": ["mainframe computer", "supercomputer", "personal computer", "minicomputer"], "answer": 0, "explain": "Figure 3 shows the System z9 computer, a line of mainframe manufactured by IBM in 2005.", "unit": "M1U1"}, {"q": "Charles Babbage invented the first runner of digital programmable and general-purpose computers in which year?", "options": ["1945", "1833", "1956", "1965"], "answer": 1, "explain": "Computer history precisely dates back to 1833, when Charles Babbage, a mathematician, invented the first runner of digital programmable and general-purpose computers.", "unit": "M1U1"}, {"q": "ENIAC was invented by...", "options": ["John W. Mauchly and J. Presper Eckert", "Charles Babbage and John Von Neumann", "Gordon Moore and Robert Noyce", "Bill Gates and Paul Allen"], "answer": 0, "explain": "The Electronic Numerical Integrator and Computer (ENIAC) was invented by John W. Mauchly and J. Presper Eckert.", "unit": "M1U1"}, {"q": "Computer software is best described as...", "options": ["the physical parts of the computer that can be touched", "a group of computers sharing a printer", "the electric pulses generated by the system clock", "a set of codes or programs of well-defined instructions, scripts, procedures, documentation and data that execute predefined tasks"], "answer": 3, "explain": "Software is a set of codes or programs involving well-defined instructions, scripts, procedures, documentation, and data that manipulate and execute predefined tasks.", "unit": "M1U2"}, {"q": "A software suite comprises programs, design specifications, documentation and...", "options": ["vacuum tubes", "users' manuals", "power supply units", "network cables"], "answer": 1, "explain": "A software suite comprises programs, also known as a set of codes, design specifications, documentation, and users' manuals.", "unit": "M1U2"}, {"q": "The course text classifies software into application software, system software, utility software, operating system and...", "options": ["hardware", "firmware", "motherboard", "power supply unit"], "answer": 1, "explain": "Generally, the software can be classified into application software, system software, utility software, operating system, and firmware.", "unit": "M1U2"}, {"q": "The operating system software interfaces between system hardware, application software and...", "options": ["the power supply", "the cooling fan", "the users", "the network cables"], "answer": 2, "explain": "Operating system software is software that interfaces between system hardware, application software, and the users.", "unit": "M1U2"}, {"q": "The course text compares the operating system to which office worker?", "options": ["A security guard", "A cleaner", "A driver", "A company secretary or receptionist"], "answer": 3, "explain": "It is analogous to a company secretary or receptionist that interacts between the guests and other workers or offices of the organization.", "unit": "M1U2"}, {"q": "A single-user operating system allows...", "options": ["one user at a time", "more than one user at a time", "thousands of users simultaneously", "no user at all"], "answer": 0, "explain": "A single-users OS allows one user at a time, while a multi-user OS allows more than one user to operate a computer at a time.", "unit": "M1U2"}, {"q": "MS Windows 95 is given as an example of a...", "options": ["single-user, single-tasking operating system", "multi-user, multi-tasking operating system", "firmware for embedded systems", "utility software for scanning barcodes"], "answer": 0, "explain": "A single-user OS may be single-tasking, e.g. MS Windows 95.", "unit": "M1U2"}, {"q": "Which of these is an example of a multi-user operating system?", "options": ["Linux and Unix Distributed OS", "MS Windows 95", "MS-DOS", "Windows 2000"], "answer": 0, "explain": "Examples of multi-user operating systems are Mainframes, IBM AS400, Linux & Unix Distributed OS.", "unit": "M1U2"}, {"q": "Application software is designed to...", "options": ["provide low-level control of a micro-controller", "manage memory, files and peripheral devices only", "solve a particular problem or perform a job in various human endeavours", "convert alternating current to direct current"], "answer": 2, "explain": "An application software is a program suite specifically designed and developed to solve a particular problem, perform a job or execute an activity.", "unit": "M1U2"}, {"q": "Firmware is mostly used for...", "options": ["word processing and spreadsheets", "embedded systems operations and control", "managing network topology", "cooling the CPU"], "answer": 1, "explain": "Firmware software is mostly used for embedded systems operations and control.", "unit": "M1U2"}, {"q": "In the context of operating systems, tasks are...", "options": ["processes or jobs running by the computer central processing unit", "physical cables connecting computers", "the keys on a keyboard", "the pixels on a monitor"], "answer": 0, "explain": "Tasks are processes or jobs running by the computer central processing unit.", "unit": "M1U2"}, {"q": "The standard architecture for all digital computer systems was designed and published in 1945 by...", "options": ["Charles Babbage", "John Von Neumann", "Gordon Moore", "J. Presper Eckert"], "answer": 1, "explain": "In 1945, the most acceptable standard architecture for all digital computer systems was designed and published by John Von Neumann.", "unit": "M2U1"}, {"q": "John Von Neumann, who published the standard computer architecture, was a...", "options": ["Nigerian electrical engineer", "American software salesman", "Hungarian mathematician who also worked as a physicist", "German chemist"], "answer": 2, "explain": "John Von Neumann was a Hungarian mathematician who doubled as a physicist.", "unit": "M2U1"}, {"q": "The central processing unit comprises the control unit, arithmetic/logic unit and...", "options": ["the power supply unit", "the hard disk drive", "the cooling fan", "processor registers"], "answer": 3, "explain": "The central processing unit comprises the control unit, arithmetic/logic unit, and processor registers.", "unit": "M2U1"}, {"q": "The system unit houses all the internal components of a computer, including the motherboard, power supply unit, fixed hard drives and...", "options": ["the printer", "communication buses", "the keyboard", "the monitor"], "answer": 1, "explain": "The system unit houses the system board or motherboard, the power supply unit, fixed hard drives, and communication buses.", "unit": "M2U1"}, {"q": "The computer power supply unit converts...", "options": ["low-voltage direct current to 100-240V alternating current", "digital signals to analog signals", "analog signals to digital signals", "100-240V alternating current to low-voltage direct current"], "answer": 3, "explain": "The power supply module enables the conversion from 100-240V alternating current to low-voltage direct current voltage.", "unit": "M2U1"}, {"q": "The CPU word size, also known as the bus size, refers to the...", "options": ["number of bits that can be transmitted at once", "number of expansion slots on the motherboard", "physical length of the bus cable", "voltage supplied to the CPU"], "answer": 0, "explain": "The CPU word size, also known as the bus size, refers to the number of bits that can be transmitted at once.", "unit": "M2U1"}, {"q": "Software-based computer buses include...", "options": ["communication protocols", "optical fibre", "copper wires", "cooling fans"], "answer": 0, "explain": "Hardware buses include wires and optical fibre, while software-based buses include communication protocols.", "unit": "M2U1"}, {"q": "All-in-one desktop system units with integrated peripheral devices are manufactured by Dell, HP and...", "options": ["Intel", "Microsoft", "Apple (iMac)", "Samsung"], "answer": 2, "explain": "Such all-in-one systems are manufactured by Dell, HP, and Apple (iMac).", "unit": "M2U1"}, {"q": "The CPU is also known as the...", "options": ["motherboard or mainboard", "modem or router", "chipset or bus", "processor, microprocessor or central processor"], "answer": 3, "explain": "The CPU is also known as the processor, microprocessor, or central processor of the computer.", "unit": "M2U2"}, {"q": "The CPU on the graphic adapter of an image processing computer system is known as the...", "options": ["central terminal unit", "control unit", "program counter", "graphical processing unit"], "answer": 3, "explain": "The CPU on the graphic adapter of an image processing computer system is known as the graphical processing unit.", "unit": "M2U2"}, {"q": "The CPU on the onboard satellite computer is popularly known as the...", "options": ["central terminal unit", "graphical processing unit", "arithmetic logic unit", "system chipset"], "answer": 0, "explain": "The CPU on the onboard satellite computer is popularly known as the central terminal unit.", "unit": "M2U2"}, {"q": "The CPU comprises the control unit, arithmetic and logical unit, processor registers and the...", "options": ["power supply", "program counter", "hard disk drive", "system clock battery"], "answer": 1, "explain": "The CPU comprises the control unit (CU), arithmetic and logical unit (ALU), processor registers, and the program counter.", "unit": "M2U2"}, {"q": "Today, the standard word size for CPUs used in personal computers is...", "options": ["8 bits", "64 bits", "16 bits", "32 bits"], "answer": 1, "explain": "Today, due to advancements in hardware technology, 64 bits is the standard word size for CPUs used in personal computers.", "unit": "M2U2"}, {"q": "The overall speed of a CPU in executing programs is proportional to its...", "options": ["physical size", "word size", "cooling fan speed", "number of ports"], "answer": 1, "explain": "The overall speed of a CPU in executing programs is proportional to its word size.", "unit": "M2U2"}, {"q": "The Intel Pentium and PowerPC are typical examples of processors for...", "options": ["IBM-PCs and Macintoshes respectively", "mainframes and supercomputers respectively", "printers and scanners respectively", "routers and switches respectively"], "answer": 0, "explain": "The Intel Pentium and PowerPC are typical examples of processors for IBM-PCs and Macintoshes, respectively.", "unit": "M2U2"}, {"q": "Which of these does the ALU NOT operate on?", "options": ["Floating-point numbers", "Integer binary numbers", "Bitwise operands", "Arithmetic operands"], "answer": 0, "explain": "The ALU performs bitwise operations and arithmetic calculations on integer binary numbers; it does not operate on other fixed- or floating-point numbers.", "unit": "M2U2"}, {"q": "The main difference between memory devices and storage devices is that memory devices store data...", "options": ["long-term for permanent access, while storage devices store data short-term", "only when the computer is switched off", "only on magnetic tape", "short-term for immediate access, while storage devices store data long-term for permanent access"], "answer": 3, "explain": "Memory devices store data in the short-term for immediate access, while storage devices store data long-term for permanent access.", "unit": "M2U3"}, {"q": "Which of these are examples of primary memory?", "options": ["HDD and SSD", "CD and DVD", "USB flash drive and floppy disk", "RAM and ROM"], "answer": 3, "explain": "Examples of primary memory are Random Access Memory (RAM) and Read-Only Memory (ROM).", "unit": "M2U3"}, {"q": "RAM is described as not persistent because...", "options": ["it cannot be read by the CPU", "its contents are erased automatically when the power is turned off", "it stores data permanently on a magnetic disk", "it is slower than secondary storage"], "answer": 1, "explain": "If the power is turned off, your data and program will be erased automatically; this means RAM is not persistent.", "unit": "M2U3"}, {"q": "SRAM uses flip-flops or MOSFET as switching devices, and an example of SRAM is...", "options": ["the hard disk drive", "a compact disc", "cache memory", "magnetic tape"], "answer": 2, "explain": "An example of SRAM is cache memory.", "unit": "M2U3"}, {"q": "DRAM requires refreshing circuits because...", "options": ["its transistors overheat", "its magnetic surface wears out", "its laser beam loses focus", "its capacitors leak current"], "answer": 3, "explain": "Unlike SRAM, DRAM requires refreshing circuits for the data refreshment to avoid current leakage.", "unit": "M2U3"}, {"q": "Most computers' main memory is made up of DRAM because DRAM...", "options": ["is faster than SRAM", "does not need any power", "is cheaper than SRAM", "stores data permanently"], "answer": 2, "explain": "DRAM is slower but cheaper than SRAM, and most computers main memory is made up of DRAM.", "unit": "M2U3"}, {"q": "The ROM chip stores the basic input/output system (BIOS) information that runs when the computer is...", "options": ["printing a document", "booting or starting", "connected to the Internet", "being manufactured"], "answer": 1, "explain": "The ROM chip stores the BIOS information that runs when the computer is booting or starting.", "unit": "M2U3"}, {"q": "Modern motherboards apply which interface instead of BIOS?", "options": ["Universal Serial Bus (USB)", "Basic Input Output System 2", "Unified Extensible Firmware Interface (UEFI)", "Digital Video Interface (DVI)"], "answer": 2, "explain": "Modern motherboards apply Unified Extensible Firmware Interface (UEFI) instead of BIOS.", "unit": "M2U3"}, {"q": "A compact disc (CD) has a storage capacity of...", "options": ["1.44 MB", "4.7 GB to 17 GB", "600 MB to 700 MB", "250 MB"], "answer": 2, "explain": "The CD has a storage capacity of 600 MB to 700 MB of data.", "unit": "M2U3"}, {"q": "Peripheral devices are connected externally to the computer's system unit through...", "options": ["the cooling fan", "appropriate interfaces and ports", "the CMOS battery", "the power supply unit only"], "answer": 1, "explain": "The peripheral devices are connected externally to the computer's system unit through appropriate interfaces and ports.", "unit": "M3U1"}, {"q": "Input devices enable the users to enter...", "options": ["power directly into the motherboard", "data and the required control parameters into the computer", "printed output onto paper", "audio output from the speakers"], "answer": 1, "explain": "Input devices are parts of the computer system that enable the users to enter data and the required control parameters into the computer.", "unit": "M3U1"}, {"q": "Which of these is a pointing input device?", "options": ["Touchpad", "Barcode reader", "Optical mark reader", "Image scanner"], "answer": 0, "explain": "Pointing input devices are used to move a cursor on the screen; examples include the mouse, trackball, and touchpad.", "unit": "M3U1"}, {"q": "A computer keyboard has a total of how many numeric, alphabet and function keys?", "options": ["84", "12", "104", "256"], "answer": 2, "explain": "There is a total of 104 numeric, alphabet, and function keys.", "unit": "M3U1"}, {"q": "How many special function keys does the keyboard have?", "options": ["104", "9", "12", "24"], "answer": 2, "explain": "The keyboard typing keys include special 12 function keys for specific purposes.", "unit": "M3U1"}, {"q": "The keyboard can be connected to the system unit...", "options": ["via cable or Bluetooth wirelessly", "only through a VGA port", "only through a barcode reader", "only by using a light pen"], "answer": 0, "explain": "The keyboard can be connected to the system unit via cable or Bluetooth wirelessly.", "unit": "M3U1"}, {"q": "A trackball operates exactly like...", "options": ["a flatbed scanner", "a light pen", "an upside-down mouse", "a barcode reader"], "answer": 2, "explain": "The device operates exactly like an upside-down mouse but uses space to rotate its ball.", "unit": "M3U1"}, {"q": "A light pen is used to...", "options": ["scan printed barcodes in supermarkets", "convert speech into electrical signals", "print hardcopy output on paper", "point and write or draw directly on the visual display unit"], "answer": 3, "explain": "A light pen is a light-sensitive input device that can be used to point and write or draw directly on the visual display unit.", "unit": "M3U1"}, {"q": "The image scanner optically scans printed materials and converts them into...", "options": ["a magnetic tape format", "an analog voltage only", "a digital format", "a printed hardcopy"], "answer": 2, "explain": "The image scanner optically scans printed materials, objects, images, and documents and converts and stores them in a digital format.", "unit": "M3U1"}, {"q": "Optical character recognition (OCR) uses which light source to detect and convert characters?", "options": ["A laser beam", "An infrared heat source", "A low-frequency light source", "A high-voltage electric arc"], "answer": 2, "explain": "OCR uses a low-frequency light source to detect and convert drawn images, alphanumeric characters, and printed text into machine-encoded text.", "unit": "M3U1"}, {"q": "A barcode reader comprises a light source, a lens and a...", "options": ["photoelectric drum", "light sensor", "selenium-coated plate", "capacitor"], "answer": 1, "explain": "The barcode reader comprises a light source, a lens, and a light sensor translating optical impulses into electrical signals.", "unit": "M3U1"}, {"q": "Headsets and microphones convert human speech or voice into...", "options": ["printed text on paper", "magnetic patterns on a disk", "laser light pulses", "electrical signals"], "answer": 3, "explain": "Headsets or microphones can record sounds by transmitting and converting human speech or voice into electrical signals.", "unit": "M3U1"}, {"q": "Barcode readers are often used to scan items in...", "options": ["aircraft cockpits only", "supermarkets and supply chain lines", "hospital operating theatres only", "telephone exchange cabinets only"], "answer": 1, "explain": "Bar code readers are often used to scan bar code items in supermarkets and different types of industrial products in the supply chain line.", "unit": "M3U1"}, {"q": "An output device converts electronic information into a format which can be...", "options": ["stored only in ROM", "understood by humans", "read only by the CPU", "transmitted only by radio"], "answer": 1, "explain": "An output device converts electronic information into a format which can be understood by humans.", "unit": "M3U2"}, {"q": "What differentiates input from output devices in terms of necessity?", "options": ["Output device usage is mandatory, while input devices may be optional", "Both are always optional", "Both are always mandatory", "Input device usage is mandatory, while output devices may be optional"], "answer": 3, "explain": "Input device usage is mandatory to operate the computer. On the other hand, output devices may be optional.", "unit": "M3U2"}, {"q": "The number of pixels on a monitor determines its...", "options": ["power consumption", "weight", "resolution", "colour depth only"], "answer": 2, "explain": "The number of pixels determines the resolution of the monitor.", "unit": "M3U2"}, {"q": "The two types of monitor screens are...", "options": ["impact monitors and non-impact monitors", "serial monitors and parallel monitors", "analog monitors and digital monitors", "cathode ray tube monitors and flat-panel screen monitors"], "answer": 3, "explain": "The two types of monitor screens are cathode ray tube monitors (CRT) and flat-panel screen monitors.", "unit": "M3U2"}, {"q": "CRT monitors applied phosphorescent dots to generate pixels and were usually...", "options": ["thin and energy efficient", "light and portable", "cheaper than flat panels", "large and consumed more power"], "answer": 3, "explain": "CRT monitor screens were usually large and consumed more power.", "unit": "M3U2"}, {"q": "Liquid Crystal Device (LCD) monitors are also known as...", "options": ["emissive displays", "plasma displays", "non-emissive displays", "cathode ray displays"], "answer": 2, "explain": "The three types of flat panel monitors are LCD monitors or non-emissive displays, LED monitors or emissive displays, and plasma monitors.", "unit": "M3U2"}, {"q": "In a plasma monitor, the picture elements are illuminated by...", "options": ["phosphorescent dots struck by electrons", "liquid crystals blocking light", "a laser beam on a selenium drum", "a tiny bit of charged gas or plasma"], "answer": 3, "explain": "The picture elements in the plasma screen monitors are illuminated by a tiny bit of charged gas or plasma similar to a small neon light.", "unit": "M3U2"}, {"q": "Which output device is described as the second most common type of output device?", "options": ["Monitor", "Plotter", "Speaker", "Printer"], "answer": 3, "explain": "A printer is the second most common type of output device that permanently transfers processed data into a printed format.", "unit": "M3U2"}, {"q": "Impact printers print characters by...", "options": ["striking on the ribbon to imprint on the paper", "spraying ink droplets through a nozzle", "drawing with a laser on a selenium drum", "heating special thermal paper"], "answer": 0, "explain": "An impact printer noisily prints characters by striking on the ribbon and thereby imprint on the paper.", "unit": "M3U2"}, {"q": "Dot matrix and daisy wheel printers are examples of...", "options": ["character printers", "line printers", "laser printers", "plotters"], "answer": 0, "explain": "The different character printers include chain, band, dot matrix, and daisy wheel printers.", "unit": "M3U2"}, {"q": "A drum printer can print up to how many lines per minute?", "options": ["10 to 50", "5000 to 10000", "1 to 100", "300 to 2000"], "answer": 3, "explain": "The drum printer has high speed and can print up to 300 to 2000 lines per minute.", "unit": "M3U2"}, {"q": "A laser printer uses a photoelectric drum, powdered ink and...", "options": ["ink droplets", "a ribbon", "laser light", "magnetic tape"], "answer": 2, "explain": "Laser printers use a photoelectric drum, powdered ink, and laser light to produce dots to form the characters for printing.", "unit": "M3U2"}, {"q": "The motherboard is best described as the...", "options": ["main circuit board firmly fixed inside a computer system unit", "power supply unit that converts AC to DC", "cooling fan mounted on the CPU", "battery that backs up the system clock"], "answer": 0, "explain": "The motherboard is the main circuit board firmly fixed inside a computer system unit to which all other internal electronic components are connected.", "unit": "M4U1"}, {"q": "The motherboard is described as a significant sizeable integrated circuit component that is...", "options": ["rectangular", "spherical", "cylindrical", "triangular"], "answer": 0, "explain": "The motherboard is a significant sizeable integrated circuit component in the system unit. It is rectangular.", "unit": "M4U1"}, {"q": "Which of these is listed as a popular motherboard manufacturer?", "options": ["Adobe", "Gigabyte", "Oracle", "Google"], "answer": 1, "explain": "Some popular motherboard manufacturers include Intel, ASUS, AOpen, ABIT, Biostar, Gigabyte, and MSI.", "unit": "M4U1"}, {"q": "The chipset on the motherboard controls data flow between the CPU, the peripherals, bus slots, memory and...", "options": ["the mains electricity supply only", "the printer paper tray", "the keyboard characters only", "other parts of the computer"], "answer": 3, "explain": "A chipset is a smaller set of chips that controls data flow between the CPU, the peripherals, bus slots, memory, and other parts of the computer.", "unit": "M4U1"}, {"q": "The CMOS battery attached to the motherboard provides memory power backup for the system clock, date, time and other setup parameters in the...", "options": ["RAM module", "hard disk drive", "BIOS chip", "expansion card"], "answer": 2, "explain": "The CMOS battery provides memory power backup for the system clock, date, time, and other system setup parameters in the BIOS chip.", "unit": "M4U1"}, {"q": "The CMOS battery is mostly which model?", "options": ["AA1000", "CR2032", "DDR400", "ATX500"], "answer": 1, "explain": "The CMOS battery is mostly CR2032.", "unit": "M4U1"}, {"q": "The computer system clock is an electrical pulse generator that...", "options": ["stores the operating system permanently", "converts analog signals to digital signals", "cools the CPU during heavy processing", "sends out a pulse of electricity at regular intervals"], "answer": 3, "explain": "The computer system clock is an electrical pulse generator that sends out a pulse of electricity at regular intervals.", "unit": "M4U1"}, {"q": "The first personal computers had clock speeds of...", "options": ["3.2 GHz", "8 MHz", "64 MHz", "100 MHz"], "answer": 1, "explain": "The first personal computers had clock speeds of 8 million pulses per second (8 MHz).", "unit": "M4U1"}, {"q": "Nowadays, personal computers have clock speeds greater than...", "options": ["8 million pulses per second", "500 million pulses per second", "100 thousand pulses per second", "3.2 billion pulses per second"], "answer": 3, "explain": "Nowadays, the PCs have clock speeds greater than 3.2 billion pulses per second (3.2 GHz).", "unit": "M4U1"}, {"q": "A serial port transmits...", "options": ["8 bits of data simultaneously", "one bit of data at a time", "16 bits of data simultaneously", "an entire file at once"], "answer": 1, "explain": "While serial ports transmit one bit of data at a time, parallel ports transmit 8 bits of data simultaneously.", "unit": "M4U1"}, {"q": "A parallel port transmits how many bits of data simultaneously?", "options": ["1", "8", "2", "64"], "answer": 1, "explain": "While serial ports transmit one bit of data at a time, parallel ports transmit 8 bits of data simultaneously.", "unit": "M4U1"}, {"q": "Which port technology is newer, much faster than serial or parallel ports, and allows multiple devices on the same port?", "options": ["Serial port", "Universal serial bus (USB) port", "Parallel port", "PS/2 port"], "answer": 1, "explain": "The technology of universal serial bus (USB) ports is newer, and the port is much faster than serial or parallel ports; USB ports allow multiple devices to be connected to the same port.", "unit": "M4U1"}, {"q": "Cooling fans and heat sink in the system unit are used to...", "options": ["convert AC voltage to DC voltage", "store the BIOS setup parameters", "connect the printer to the motherboard", "prevent excessive heat radiation and maintain the specified operating condition"], "answer": 3, "explain": "The cooling fans and heat sink prevent excessive heat radiation and maintain the specified operating condition inside and outside the system unit.", "unit": "M4U1"}, {"q": "A microchip is a set of electronic circuits with millions of miniatured transistors mounted on...", "options": ["a long strip of magnetic tape", "a small flat piece of silicon slab", "a glass compact disc", "a copper power cable"], "answer": 1, "explain": "A microchip is a set of electronic circuits with millions of miniatured transistors mounted on a small flat piece of silicon slab.", "unit": "M4U2"}, {"q": "Microchips are also known as...", "options": ["ports or sockets", "buses or cables", "chips or integrated circuits", "drivers or utilities"], "answer": 2, "explain": "Microchips, also known as chips or integrated circuits (IC), function basically as switching devices that can turn current on or off.", "unit": "M4U2"}, {"q": "Silicon is described as a...", "options": ["semiconductor material", "perfect insulator", "magnetic material", "liquid crystal"], "answer": 0, "explain": "Silicon, a semiconductor material, is an active part of the transistor made of silicon.", "unit": "M4U2"}, {"q": "Silicon can have its conductive properties increased by mixing it with materials like...", "options": ["gold or silver", "oxygen or nitrogen", "boron or phosphorus", "lead or mercury"], "answer": 2, "explain": "Silicon, being a semiconductor, can have its conductive properties increased by mixing it with materials like boron or phosphorus.", "unit": "M4U2"}, {"q": "Silicon is made from sand and is the...", "options": ["most abundant element on earth", "second most abundant element next to oxygen", "rarest element in the earth's crust", "third most abundant gas in the atmosphere"], "answer": 1, "explain": "Silicon is made from sand, the second most abundant element next to oxygen.", "unit": "M4U2"}, {"q": "Silicon wafers are produced from silica sand, which is made of...", "options": ["sodium chloride", "calcium carbonate", "silicon dioxide", "iron oxide"], "answer": 2, "explain": "Silicon wafers are produced from silica sand, which is made of silicon dioxide.", "unit": "M4U2"}, {"q": "Chip size is usually measured in...", "options": ["centimeters", "kilograms", "gigahertz", "nanometers"], "answer": 3, "explain": "Chip size is usually measured in nanometers, approximately one billionth of a meter.", "unit": "M4U2"}, {"q": "The two types of microchips available are...", "options": ["serial chips and parallel chips", "input chips and output chips", "logic chips and memory chips", "analog chips and digital chips"], "answer": 2, "explain": "Logic chips and Memory chips are the types of microchips available.", "unit": "M4U2"}, {"q": "The neural processing unit (NPU) was designed for...", "options": ["artificial intelligence works, especially deep and machine learning applications", "visual display performance", "converting analog signals to digital signals", "storing the BIOS permanently"], "answer": 0, "explain": "The NPU was designed for artificial intelligence works, especially the deep and machine learning applications.", "unit": "M4U2"}, {"q": "Which companies are given as examples of integrated device manufacturers (IDMs) that both design and manufacture chips?", "options": ["TSMC and UMC", "Intel and Samsung", "Qualcomm and Nvidia", "Amazon and Google"], "answer": 1, "explain": "The integrated device manufacturers (IDMs) such as Intel and Samsung both design and manufacture chips.", "unit": "M4U2"}, {"q": "Companies that manufacture chips under contract for other companies are called...", "options": ["fabless companies", "integrated device manufacturers", "foundries", "retailers"], "answer": 2, "explain": "Foundries are companies that manufacture chips under contract for other companies, such as TSMC, Global Foundries and UMC.", "unit": "M4U2"}, {"q": "Qualcomm, Nvidia and AMD are described as fabless companies because they...", "options": ["own and operate their own silicon foundries", "focus only on chip design and avoid the cost of production facilities", "manufacture chips only for Intel", "produce memory chips only"], "answer": 1, "explain": "Fabless companies avoid the high costs of building and maintaining production facilities by focusing only on chip design.", "unit": "M4U2"}, {"q": "Computer networking can be described as...", "options": ["the process of manufacturing microchips on silicon wafers", "an interconnection of several computers and computing devices to share resources effectively", "the conversion of analog signals into digital numbers", "the permanent storage of data on a hard disk drive"], "answer": 1, "explain": "Computer networking can be described as an interconnection of several computers and computing devices to share resources effectively.", "unit": "M5U1"}, {"q": "Computers on a network are called...", "options": ["nodes or hosts", "ports or sockets", "chipsets or buses", "cores or threads"], "answer": 0, "explain": "Computers on a network are called nodes or hosts.", "unit": "M5U1"}, {"q": "While a modem sends information over a communication line, a network card sends information over...", "options": ["a network cable", "a telephone line", "the power supply cable", "a satellite dish"], "answer": 0, "explain": "While a modem sends information over a communication line, a network card sends information over a network cable.", "unit": "M5U1"}, {"q": "Ethernet cables such as category 5 and CAT 6 use which connectors?", "options": ["VGA connectors", "PS/2 connectors", "RJ-45 connectors", "CR2032 connectors"], "answer": 2, "explain": "Examples of ethernet cables include category 5, CAT 6i with cable RJ-45 connectors.", "unit": "M5U1"}, {"q": "A local area network (LAN) interconnects computers within...", "options": ["a large geographical region spanning several countries", "a single microchip package", "an organization's external suppliers only", "a local place or area such as a school, laboratory or office"], "answer": 3, "explain": "LAN is a computer network that interconnects computers within a local place or area, such as residential buildings, schools, laboratories, university campuses and offices.", "unit": "M5U1"}, {"q": "A wide area network (WAN) is a type of network that...", "options": ["extends over a large geographical region", "covers only one office building", "connects devices within a single room", "exists only inside one microchip"], "answer": 0, "explain": "WAN is a type of network that extends over a large geographical region, often established with leased telecommunication circuits.", "unit": "M5U1"}, {"q": "An intranet is best described as...", "options": ["a worldwide network of networks open to the public", "a network that connects only external suppliers", "a dedicated computer network strictly within an organization", "a wireless network limited to a home"], "answer": 2, "explain": "An intranet is a dedicated computer network strictly within an organization; it is a classified network for sharing resources securely.", "unit": "M5U1"}, {"q": "A specialized private network that allows access to specifically authorized bodies, partners, vendors and suppliers is called a(n)...", "options": ["intranet", "personal area network", "storage area network", "extranet"], "answer": 3, "explain": "The extranet is a specialized private network that allows access to specifically authorized bodies, partners, vendors, suppliers, and corporate organizations.", "unit": "M5U1"}, {"q": "A virtual private network (VPN)...", "options": ["replaces the motherboard inside a computer", "converts digital data into analog signals", "stores the BIOS configuration permanently", "extends a private network across a public network"], "answer": 3, "explain": "VPN extends a private network across a public network and enables users to send and receive data across shared or public networks.", "unit": "M5U1"}, {"q": "Which of these is a common network topology listed in the course text?", "options": ["Firmware", "Chipset", "Mesh", "Nanometer"], "answer": 2, "explain": "Common examples of network topology include Bus, Star, Mesh, Ring, and Daisy chain.", "unit": "M5U1"}, {"q": "Multi-core technology can be described as the configuration, architecture and joint operation of...", "options": ["two or more separate computers on one network", "two or more hard disks in one system unit", "two or more monitors on one desk", "two or more logical CPUs on the same processor chip"], "answer": 3, "explain": "Multi-core technology is the configuration, architecture, and joint operation of two or more logical CPUs on the same processor chip.", "unit": "M5U2"}, {"q": "A dual-core processor refers to a single chip or physical CPU containing...", "options": ["four separate processors on two sockets", "two separate processors or execution cores", "eight separate processors on two sockets", "one processor with two cooling fans"], "answer": 1, "explain": "A dual-core refers to a single chip or physical CPU containing two separate processors or execution cores.", "unit": "M5U2"}, {"q": "Dual quad cores refer to two sockets having four CPUs each, making a total of...", "options": ["two core processors", "four core processors", "eight core processors", "sixteen core processors"], "answer": 2, "explain": "Dual quad cores refer to two sockets having four CPUs each, making the total of eight core processors.", "unit": "M5U2"}, {"q": "Technically, a dual core processor is about how much in performance compared with a single core processor?", "options": ["Half", "Four times", "Twice", "The same"], "answer": 2, "explain": "Technically, a dual core processor is about twice in performance than a single core processor.", "unit": "M5U2"}, {"q": "Multi-core systems ultimately minimize...", "options": ["power and heat", "screen resolution", "network bandwidth", "keyboard response time"], "answer": 0, "explain": "Multi-core systems ultimately minimize the power and heat.", "unit": "M5U2"}, {"q": "Multithreaded software is software capable of...", "options": ["running only on a single core one task at a time", "splitting large or complex tasks into separate workloads that can be processed concurrently on each core", "converting analog signals into digital signals", "storing the operating system permanently in ROM"], "answer": 1, "explain": "Multithreaded software is capable of splitting large or complex tasks into a set of separate workloads that could be processed and executed concurrently on each of the cores present.", "unit": "M5U2"}, {"q": "While serial computing allows each process to run sequentially, parallel computing enables...", "options": ["only one process to run at a time", "multiple processes to be executed simultaneously", "processes to run without any CPU", "data to be stored permanently"], "answer": 1, "explain": "While serial computing allows each process to run sequentially, the parallel computing technique enables multiple processes to be executed simultaneously.", "unit": "M5U2"}, {"q": "Which of these is one of the four categories of parallel computers?", "options": ["Silicon parallelism", "Storage parallelism", "Display parallelism", "Data parallelism"], "answer": 3, "explain": "The four categories of parallel computers are bit-level parallelism, instruction-level parallelism, data parallelism, and task parallelism.", "unit": "M5U2"}, {"q": "An embedded hardware device is a specialized computer system that...", "options": ["exists as an in-built or integral part of bigger equipment and functions with less human interaction", "is always installed as a standalone desktop on an office desk", "only works when connected directly to the mains supply", "replaces the need for any processor or software"], "answer": 0, "explain": "An embedded hardware device is a specialized computer system that exists as an in-built or integral part of bigger equipment, machine, or system, which can function with less human interaction.", "unit": "M5U3"}, {"q": "Technically, an embedded system is designed and implemented on a single microprocessor board with the programs stored in...", "options": ["ROM", "the hard disk drive", "a USB flash drive", "the CMOS battery"], "answer": 0, "explain": "An embedded system is designed and implemented on a single microprocessor board with the programs stored in ROM.", "unit": "M5U3"}, {"q": "Embedded systems often work within a pre-defined time, which is also known as...", "options": ["cloud computing", "parallel computing", "real-time computing", "grid computing"], "answer": 2, "explain": "Usually, the embedded systems often work within the pre-defined time, also known as real-time computing.", "unit": "M5U3"}, {"q": "Embedded software is described as...", "options": ["a full-fledged operating system for mainframes", "an application suite for desktop publishing", "a utility for scanning barcodes at supermarkets", "real-time software developed specifically to control the designed functions of in-built devices"], "answer": 3, "explain": "Embedded software is real-time software explicitly developed to control the designed functions of the in-built devices.", "unit": "M5U3"}, {"q": "An on-board computer can be described as a computer or hybrid computing system specifically configured and installed in...", "options": ["a fixed desktop in a school laboratory", "a rack in a cloud data centre only", "mobile objects or vehicles such as submarines, ships, aircraft and spacecraft", "a supermarket checkout counter"], "answer": 2, "explain": "An on-board computer is a computer or hybrid computing system specifically configured and installed in mobile objects or vehicles such as submarines, ships, aircraft, and spacecraft.", "unit": "M5U3"}, {"q": "The on-board software, including the operating system and applications, runs in the OBC under the control of the onboard processor known as the...", "options": ["GPU", "CTU", "NPU", "ALU"], "answer": 1, "explain": "The on-board software runs in the OBC under the control of the onboard processor, known as the CTU.", "unit": "M5U3"}, {"q": "The controller embedded in an elevator is used to...", "options": ["read signals from a satellite dish", "print tickets for passengers", "convert analog voltage into digital numbers", "control the motor to move the elevator to different floors based on the buttons the user presses"], "answer": 3, "explain": "The controller embedded in an elevator controls the motor to move the elevator to different floors based on buttons that the user presses.", "unit": "M5U3"}, {"q": "A binary number has only two discrete values, which are...", "options": ["zero to nine", "one to ten", "A to F", "zero or one"], "answer": 3, "explain": "A binary number has only two discrete values, zero or one.", "unit": "M6U1"}, {"q": "In a computer, the binary values zero and one are represented by the OFF and ON states of an electronic switch called a...", "options": ["capacitor", "resistor", "transistor", "diode"], "answer": 2, "explain": "Each of these discrete values is represented by the OFF and ON states of an electronic switch called a transistor.", "unit": "M6U1"}, {"q": "One byte, which represents a character, comprises how many bits?", "options": ["2", "8", "4", "16"], "answer": 1, "explain": "A binary digit (Bit) has a value of either 0 or 1, and 1 byte (a Character) comprises 8 bits.", "unit": "M6U1"}, {"q": "A single bit can represent all of the following EXCEPT...", "options": ["A decimal digit from 0 to 9", "Yes or No", "True or False", "On or Off"], "answer": 0, "explain": "A bit can represent Yes or No, True or False, or On or Off.", "unit": "M6U1"}, {"q": "ASCII stands for...", "options": ["American Standard Code for Information Interchange", "American System Code for Internet Information", "Advanced Standard Character Input Interface", "Automatic Symbol Code for Integrated Information"], "answer": 0, "explain": "ASCII is the American Standard Code for Information Interchange.", "unit": "M6U1"}, {"q": "Standard ASCII-encoded data has unique values for how many alphabetic, numeric or special characters and control codes?", "options": ["256", "64", "128", "1024"], "answer": 2, "explain": "There are unique values for 128 alphabetic, numeric or special additional characters and control codes in standard ASCII-encoded data.", "unit": "M6U1"}, {"q": "A kilobyte is equal to...", "options": ["1024 bytes", "1000 bytes", "1024 bits", "1024 kilobytes"], "answer": 0, "explain": "Kilobyte: 1024 bytes (or 2^10 bytes).", "unit": "M6U1"}, {"q": "A megabyte is about...", "options": ["one billion bytes", "one trillion bytes", "one million bytes", "one thousand bytes"], "answer": 2, "explain": "Megabyte: 1024 * 1024 bytes (or 2^20 bytes), this is about one million bytes.", "unit": "M6U1"}, {"q": "A terabyte is about...", "options": ["one trillion bytes", "one million bytes", "one billion bytes", "one hundred bytes"], "answer": 0, "explain": "Terabyte: 1024 * 1024 * 1024 * 1024 bytes (or 2^40 bytes), this is about one trillion bytes.", "unit": "M6U1"}, {"q": "An analog-to-digital converter (ADC) converts...", "options": ["binary digital code to analog signals", "alternating current to direct current", "digital data into printed hardcopy", "an input analog voltage or current to a discrete digital number"], "answer": 3, "explain": "An ADC is an electronic device that converts an input analog voltage or current to a discrete digital number, that is, from analog signals into digital signals.", "unit": "M6U1"}, {"q": "The size of the digital number produced by an ADC grows with...", "options": ["increasing input voltage or current", "decreasing input voltage or current", "the length of the connecting cable", "the size of the monitor screen"], "answer": 0, "explain": "The size of the number grows with increasing input voltage or current.", "unit": "M6U1"}, {"q": "A digital-to-analog converter (DAC) converts...", "options": ["analog voltage or current to a discrete digital number", "printed text into machine-encoded text", "AC power into low-voltage DC power", "binary digital code or data to analog signals such as current, voltage or electric charge"], "answer": 3, "explain": "A digital-to-analog converter is a device on a single chip for converting binary digital code or data to analog signals such as current, voltage, or electric charge.", "unit": "M6U1"}, {"q": "RAMDAC stands for...", "options": ["Random Access Memory DAC", "Rapid Analog Memory Data Converter", "Read Access Memory Digital Adapter", "Random Analog Multiplexed Data Circuit"], "answer": 0, "explain": "Video adapters need DACs, commonly known as Random Access Memory DAC (RAMDAC).", "unit": "M6U1"}, {"q": "A modem converts signals from digital to analog before transmitting them over...", "options": ["fibre optic cables that transmit only digital signals", "the computer's internal data bus", "the motherboard's expansion slot", "telephone lines that transmit only analog signals"], "answer": 3, "explain": "One example is a modem that converts signals from digital to analog before transmitting those signals over communication lines such as telephone lines that transmit only analog signals.", "unit": "M6U1"}, {"q": "Cloud computing is a means of accessing, processing and saving computing hardware and software through...", "options": ["a local hard drive only", "a single microchip", "a printed manual", "the Internet"], "answer": 3, "explain": "Cloud computing is a means of accessing, processing, and saving computing hardware, and software (data or programs) through the Internet.", "unit": "M6U2"}, {"q": "The course text compares cloud computing to the provision of electricity by...", "options": ["the Power Holding Company of Nigeria (PHCN)", "the Nigerian National Space Research and Development Agency", "the Central Bank of Nigeria", "the National Identity Management Commission"], "answer": 0, "explain": "Cloud computing is a similitude to the provision of electricity by Power Holding Company of Nigeria (PHCN) for consumers who pay for the service accordingly.", "unit": "M6U2"}, {"q": "Which of these are given as examples of cloud computing providers?", "options": ["Windows Azure and Google App Engine", "MS Word and Excel", "Intel Pentium and PowerPC", "Windows 95 and MS-DOS"], "answer": 0, "explain": "Examples of cloud computing providers are Windows Azure, and Google App Engine.", "unit": "M6U2"}, {"q": "The three categories of cloud computing services are...", "options": ["SaaS, IaaS and PaaS", "LAN, WAN and PAN", "ADC, DAC and RAMDAC", "CPU, GPU and NPU"], "answer": 0, "explain": "The cloud computing services comprise Software-as-a-Service (SaaS), Infrastructure-as-a-Service (IaaS), and Platform-as-a-Service (PaaS).", "unit": "M6U2"}, {"q": "Which of these is an example of Software-as-a-Service (SaaS)?", "options": ["Rackspace", "Dropbox", "Heroku", "Cisco Metapod"], "answer": 1, "explain": "Examples of SaaS include Google Apps, MailChimp, Office Online, and Dropbox.", "unit": "M6U2"}, {"q": "Vendor lock-in, listed as a drawback of SaaS, means that...", "options": ["the software cannot be accessed through a web browser", "users are tied to their vendors and swapping vendors is usually difficult", "the subscription cost is always lower than local installation", "the provider manages all software updates for the user"], "answer": 1, "explain": "There is Vendor Lock-In, which means users are tied to their vendors and swapping vendors is usually difficult sometimes.", "unit": "M6U2"}, {"q": "Infrastructure-as-a-Service (IaaS) resources include storage, networking, processing and...", "options": ["virtualization", "word processing", "barcode scanning", "photocopying"], "answer": 0, "explain": "IaaS are the resources made available as a cloud-based service; these include storage, networking, processing, and virtualization.", "unit": "M6U2"}, {"q": "Which of these is an example of Infrastructure-as-a-Service (IaaS)?", "options": ["Google Apps", "Amazon Web Services (AWS)", "Office Online", "MailChimp"], "answer": 1, "explain": "Examples of IaaS include Rackspace, Amazon Web Services (AWS), Microsoft Azure, Cisco Metapod.", "unit": "M6U2"}, {"q": "Platform-as-a-Service (PaaS) is used to provide...", "options": ["permanent storage for backup tapes", "a physical network cable connection", "a platform for software creation", "electricity to the data centre"], "answer": 2, "explain": "PaaS is used to provide a platform for software creation, allowing developers to focus on coding their applications.", "unit": "M6U2"}, {"q": "Which of these is an example of Platform-as-a-Service (PaaS)?", "options": ["Heroku", "Dropbox", "Rackspace", "Amazon Web Services (AWS)"], "answer": 0, "explain": "Examples of PaaS include Apache Stratos, AWS Elastic Beanstalk, Windows Azure, Heroku, Force.com, Google App Engine.", "unit": "M6U2"}, {"q": "Which technologies are often deployed to maximize online processing power in cloud computing networks?", "options": ["Barcode reading and optical character recognition", "Serial and parallel port switching", "Virtualization and hyperthreading", "Impact and non-impact printing"], "answer": 2, "explain": "Virtualization and hyperthreading technologies are often deployed to maximize online processing power.", "unit": "M6U2"}];

  <div class=card><b>Modules</b><div class=row>${Object.entries(MODS).map(([k,v])=>`<button data-m="${esc(k)}" class="${pick.has(k)?'sel':''}">${esc(v)}</button>`).join("")}</div>
  <b>How many</b><div class=row>${SIZES.map(s=>`<button data-n="${s}" class="${size===s?'sel':''}">${s===Q.length?`All (${s})`:s}</button>`).join("")}</div>
  <div class=row><button class=pri id=go${n?"":" disabled"}>Start</button>${miss.length?`<button id=redo>Redo my ${miss.length} misses</button>`:""}</div>
  ${n?"":`<div class=ex>No questions for the modules you selected. Pick at least one module.</div>`}</div>`;
  app.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{const m=b.dataset.m;pick.has(m)?pick.delete(m):pick.add(m);if(!pick.size)pick.add(m);home();});
  app.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{size=+b.dataset.n;home();});
  const go=document.getElementById("go"); if(go) go.onclick=()=>start(shuffle(Q.map((q,i)=>i).filter(i=>pick.has(modOf(Q[i].unit)))).slice(0,size));
  const r=document.getElementById("redo"); if(r) r.onclick=()=>start(shuffle(miss.filter(i=>Q[i])));
  const h=document.getElementById("hm"); if(h) h.onclick=home;
}
function start(ids){
  if(!ids.length){ app.innerHTML = message("No questions to ask. Pick more modules on the home screen."); document.getElementById("hm").onclick=home; return; }
  run = {ids, i:0, right:0, wrong:[]}; show();
}
function show(){
  const {ids,i} = run, q = Q[ids[i]], order = shuffle([0,1,2,3]);
  app.innerHTML = `<div class=meta><span>Question ${i+1} of ${ids.length}</span><span>${esc(q.unit)} · ${run.right} right</span></div>
  <div class=bar><i style="width:${i/ids.length*100}%"></i></div>
  <div class=card><p class=q>${esc(q.q)}</p>${order.map((o,k)=>`<button class=opt data-o="${o}">${L[k]}. ${esc(q.options[o])}</button>`).join("")}<div id=after></div></div>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.o));
}
function answer(o){
  const q = Q[run.ids[run.i]], ok = o === q.answer;
  app.querySelectorAll(".opt").forEach(b=>{b.disabled=true;const v=+b.dataset.o;if(v===q.answer)b.classList.add("ok");else if(v===o)b.classList.add("bad");});
  if (ok) run.right++; else run.wrong.push(run.ids[run.i]);
  const why = (!ok && Array.isArray(q.why_wrong)) ? (q.why_wrong[o] || "") : "";
  const last = run.i === run.ids.length - 1;
  document.getElementById("after").innerHTML = `<div class=ex><b>${ok?"Right.":"Not quite."}</b> ${esc(q.explain)}${why?`<div class=why><b>Your choice:</b> ${esc(why)}</div>`:""}</div><div class=row><button class=pri id=nx>${last?"See results":"Next"}</button></div>`;
  document.getElementById("nx").onclick = () => { if (last) done(); else { run.i++; show(); } };
}
function done(){
  const miss = new Set(store.get());
  run.ids.forEach(i=>miss.delete(i)); run.wrong.forEach(i=>miss.add(i)); store.set([...miss]);
  const pct = Math.round(run.right / run.ids.length * 100);
  app.innerHTML = `<h1>Done</h1><div class=card><div class=big>${run.right} / ${run.ids.length}</div><p class=mute>${pct}% correct. Misses are saved; use "Redo my misses" later.</p>
  ${run.wrong.length?`<b>To review</b><ol>${run.wrong.map(i=>`<li>${esc(Q[i].q)}<br><span class=mute>${esc(Q[i].options[Q[i].answer])}</span></li>`).join("")}</ol>`:""}
  <div class=row><button class=pri id=hm>Back</button></div></div>`;
  document.getElementById("hm").onclick = home;
}
home();
</script></body></html>
